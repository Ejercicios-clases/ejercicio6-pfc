name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Compilar
      id: compilar
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Compilar
        setup-command: chmod u+x gradlew
        command: "./gradlew build -x test"
        timeout: 10
        max-score: 30
    - name: Ejercicio 1
      id: ejercicio-1
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Ejercicio 1
        setup-command: ''
        command: "./gradlew test --tests taller.Ejercicio1Test"
        timeout: 10
        max-score: 40
    - name: Ejercicio 2
      id: ejercicio-2
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Ejercicio 2
        setup-command: ''
        command: "./gradlew test --tests taller.Ejercicio2Test"
        timeout: 10
        max-score: 40
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        COMPILAR_RESULTS: "${{steps.compilar.outputs.result}}"
        EJERCICIO-1_RESULTS: "${{steps.ejercicio-1.outputs.result}}"
        EJERCICIO-2_RESULTS: "${{steps.ejercicio-2.outputs.result}}"
      with:
        runners: compilar,ejercicio-1,ejercicio-2
